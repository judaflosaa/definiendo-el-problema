<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco de Definición de Problemas - HBR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for browser execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-break-inside-avoid { break-inside: avoid; }
        }
        /* Custom scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Component using Lucide
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const QuestionField = ({ label, value, onChange, placeholder, isPrintMode }) => (
            <div className={`mb-6 ${isPrintMode ? 'print-break-inside-avoid' : ''}`}>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                    {label}
                </label>
                {isPrintMode ? (
                    <div className="p-3 bg-gray-50 border-l-4 border-orange-400 text-sm text-gray-800 whitespace-pre-wrap min-h-[40px]">
                        {value || <span className="text-gray-300 italic text-[11px]">Sin respuesta</span>}
                    </div>
                ) : (
                    <textarea
                        className="w-full p-3 bg-white border-2 border-gray-100 rounded-xl focus:border-orange-400 focus:ring-0 outline-none transition-all text-sm text-gray-700 placeholder-gray-300 min-h-[100px] resize-none"
                        placeholder={placeholder}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                    />
                )}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState(0);
            const [isPrintMode, setIsPrintMode] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            
            const [formData, setFormData] = useState({
                basicNeed: "", desiredOutcome: "", beneficiaries: "",
                strategicAlignment: "", companyBenefits: "", implementationPlan: "",
                previousApproaches: "", othersApproaches: "", constraints: "",
                subProblems: "", requirements: "", solvers: "", statementLanguage: "", submissionNeeds: "", incentives: "", evaluationSuccess: ""
            });

            const handleChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const handleReset = () => {
                setFormData(Object.keys(formData).reduce((acc, key) => ({ ...acc, [key]: "" }), {}));
                setShowResetConfirm(false);
            };

            const tabs = [
                { id: 0, title: "1. Establecer Necesidad", icon: "clipboard-check" },
                { id: 1, title: "2. Justificar", icon: "shield-check" },
                { id: 2, title: "3. Contextualizar", icon: "search" },
                { id: 3, title: "4. Definición Final", icon: "file-edit" }
            ];

            return (
                <div className={`min-h-screen ${isPrintMode ? 'bg-white p-0' : 'bg-gray-50 p-4 md:p-8'}`}>
                    <div className="max-w-4xl mx-auto">
                        
                        {/* Header UI */}
                        {!isPrintMode && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div>
                                    <h1 className="text-2xl font-black text-gray-900 tracking-tight uppercase">
                                        MARCO DE DEFINICIÓN <span className="text-orange-500 italic">DE PROBLEMAS</span>
                                    </h1>
                                    <p className="text-gray-500 text-[10px] uppercase font-bold tracking-widest">
                                        Estrategia de Thomas Wedell-Wedellsborg
                                    </p>
                                </div>
                                
                                <div className="flex gap-2">
                                    {!showResetConfirm ? (
                                        <button onClick={() => setShowResetConfirm(true)} className="p-2 text-gray-400 hover:text-red-500 transition-colors">
                                            <Icon name="rotate-ccw" size={20} />
                                        </button>
                                    ) : (
                                        <div className="flex items-center gap-1 bg-red-50 p-1 rounded-lg border border-red-100">
                                            <button onClick={handleReset} className="p-1.5 bg-red-500 text-white rounded"><Icon name="check" size={14} /></button>
                                            <button onClick={() => setShowResetConfirm(false)} className="p-1.5 bg-gray-200 text-gray-600 rounded"><Icon name="x" size={14} /></button>
                                        </div>
                                    )}
                                    <button 
                                        onClick={() => setIsPrintMode(true)}
                                        className="flex items-center gap-2 px-5 py-2 text-xs font-black text-white bg-gray-900 rounded-xl hover:bg-black transition-all shadow-lg active:scale-95 uppercase"
                                    >
                                        <Icon name="printer" size={16} /> Exportar PDF
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Tab Navigation */}
                        {!isPrintMode && (
                            <div className="flex overflow-x-auto gap-2 mb-6 no-scrollbar pb-2">
                                {tabs.map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 py-3 rounded-xl font-bold text-[10px] uppercase whitespace-nowrap transition-all border-2
                                            ${activeTab === tab.id 
                                                ? 'bg-white border-orange-500 text-orange-600 shadow-sm' 
                                                : 'bg-white border-transparent text-gray-400 hover:border-gray-200'}`}
                                    >
                                        <Icon name={tab.icon} size={14} />
                                        {tab.title}
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* Export Instructions */}
                        {isPrintMode && (
                            <div className="bg-orange-600 text-white p-6 rounded-2xl mb-8 flex flex-col md:flex-row items-center justify-between gap-4 no-print">
                                <div className="flex items-center gap-4">
                                    <Icon name="printer" size={32} />
                                    <div>
                                        <h2 className="font-black uppercase tracking-tight text-lg leading-tight">Documento Listo para Exportar</h2>
                                        <p className="text-xs opacity-90 mt-1">1. Presiona <strong>Ctrl + P</strong>  |  2. Elige <strong>"Guardar como PDF"</strong></p>
                                    </div>
                                </div>
                                <button onClick={() => setIsPrintMode(false)} className="bg-white text-orange-600 px-6 py-2 rounded-full font-bold text-[10px] uppercase">
                                    Volver a la edición
                                </button>
                            </div>
                        )}

                        {/* Form Content */}
                        <div className={`bg-white rounded-3xl ${isPrintMode ? 'p-0 shadow-none' : 'p-8 shadow-xl border border-gray-100'}`}>
                            
                            {/* SECCIÓN 1 */}
                            {(activeTab === 0 || isPrintMode) && (
                                <section className={isPrintMode ? 'mb-12 border-b-2 border-gray-100 pb-8' : ''}>
                                    <div className="flex items-center gap-3 mb-8">
                                        <div className="p-2 bg-orange-100 text-orange-600 rounded-lg"><Icon name="clipboard-check" /></div>
                                        <h2 className="text-xl font-black text-gray-800">1. Establecer la Necesidad</h2>
                                    </div>
                                    <QuestionField label="¿Cuál es la necesidad básica?" value={formData.basicNeed} onChange={(v) => handleChange('basicNeed', v)} placeholder="..." isPrintMode={isPrintMode} />
                                    <QuestionField label="¿Cuál es el resultado deseado?" value={formData.desiredOutcome} onChange={(v) => handleChange('desiredOutcome', v)} placeholder="..." isPrintMode={isPrintMode} />
                                    <QuestionField label="¿Quién se beneficia y por qué?" value={formData.beneficiaries} onChange={(v) => handleChange('beneficiaries', v)} placeholder="..." isPrintMode={isPrintMode} />
                                </section>
                            )}

                            {/* SECCIÓN 2 */}
                            {(activeTab === 1 || isPrintMode) && (
                                <section className={isPrintMode ? 'mb-12 border-b-2 border-gray-100 pb-8' : ''}>
                                    <div className="flex items-center gap-3 mb-8">
                                        <div className="p-2 bg-blue-100 text-blue-600 rounded-lg"><Icon name="shield-check" /></div>
                                        <h2 className="text-xl font-black text-gray-800">2. Justificar</h2>
                                    </div>
                                    <QuestionField label="¿Está alineado con nuestra estrategia?" value={formData.strategicAlignment} onChange={(v) => handleChange('strategicAlignment', v)} placeholder="..." isPrintMode={isPrintMode} />
                                    <QuestionField label="¿Beneficios deseados y medición?" value={formData.companyBenefits} onChange={(v) => handleChange('companyBenefits', v)} placeholder="..." isPrintMode={isPrintMode} />
                                    <QuestionField label="¿Cómo aseguraremos la implementación?" value={formData.implementationPlan} onChange={(v) => handleChange('implementationPlan', v)} placeholder="..." isPrintMode={isPrintMode} />
                                </section>
                            )}

                            {/* SECCIÓN 3 */}
                            {(activeTab === 2 || isPrintMode) && (
                                <section className={isPrintMode ? 'mb-12 border-b-2 border-gray-100 pb-8' : ''}>
                                    <div className="flex items-center gap-3 mb-8">
                                        <div className="p-2 bg-purple-100 text-purple-600 rounded-lg"><Icon name="search" /></div>
                                        <h2 className="text-xl font-black text-gray-800">3. Contextualizar</h2>
                                    </div>
                                    <QuestionField label="¿Qué enfoques hemos intentado antes?" value={formData.previousApproaches} onChange={(v) => handleChange('previousApproaches', v)} placeholder="..." isPrintMode={isPrintMode} />
                                    <QuestionField label="¿Qué han intentado otros?" value={formData.othersApproaches} onChange={(v) => handleChange('othersApproaches', v)} placeholder="..." isPrintMode={isPrintMode} />
                                    <QuestionField label="¿Restricciones internas y externas?" value={formData.constraints} onChange={(v) => handleChange('constraints', v)} placeholder="..." isPrintMode={isPrintMode} />
                                </section>
                            )}

                            {/* SECCIÓN 4 */}
                            {(activeTab === 3 || isPrintMode) && (
                                <section>
                                    <div className="flex items-center gap-3 mb-8">
                                        <div className="p-2 bg-green-100 text-green-600 rounded-lg"><Icon name="file-edit" /></div>
                                        <h2 className="text-xl font-black text-gray-800">4. Definición Final</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <QuestionField label="¿Son en realidad varios problemas?" value={formData.subProblems} onChange={(v) => handleChange('subProblems', v)} isPrintMode={isPrintMode} />
                                        <QuestionField label="¿Requisitos de la solución?" value={formData.requirements} onChange={(v) => handleChange('requirements', v)} isPrintMode={isPrintMode} />
                                        <QuestionField label="¿Perfiles solucionadores?" value={formData.solvers} onChange={(v) => handleChange('solvers', v)} isPrintMode={isPrintMode} />
                                        <QuestionField label="¿Información y lenguaje clave?" value={formData.statementLanguage} onChange={(v) => handleChange('statementLanguage', v)} isPrintMode={isPrintMode} />
                                        <QuestionField label="¿Qué deben entregar?" value={formData.submissionNeeds} onChange={(v) => handleChange('submissionNeeds', v)} isPrintMode={isPrintMode} />
                                        <QuestionField label="¿Incentivos necesarios?" value={formData.incentives} onChange={(v) => handleChange('incentives', v)} isPrintMode={isPrintMode} />
                                    </div>
                                    <QuestionField label="¿Evaluación y medición del éxito?" value={formData.evaluationSuccess} onChange={(v) => handleChange('evaluationSuccess', v)} isPrintMode={isPrintMode} />
                                </section>
                            )}
                        </div>

                        {/* Footer UI */}
                        {!isPrintMode && (
                            <div className="mt-8 flex items-center justify-between p-4 bg-white rounded-xl border border-gray-100 text-[9px] text-gray-400 font-bold uppercase tracking-widest">
                                <span>Definición de Problemas</span>
                                <span className="flex items-center gap-1"><Icon name="info" size={12} /> HBR Strategic Tool</span>
                            </div>
                        )}
                        
                        <div className="hidden print:block mt-12 pt-6 border-t text-center text-[10px] text-gray-400 italic">
                            Documento Estratégico basado en Thomas Wedell-Wedellsborg
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
